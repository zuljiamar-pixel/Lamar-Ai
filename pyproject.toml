[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamar-ai"
version = "0.1.0"
description = "Lamar AI – eine KI, die für dich programmiert (Terminal-Agent auf Basis von Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0,<3",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lamar = "lamar.cli:main"

[tool.setuptools]
packages = ["lamar"]
